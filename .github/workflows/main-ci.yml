name: Main CI

on:
  push:
    branches:
      - main
      - codex/main-ci
      - codex/artex-ci-code-scanning
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest ruff==0.17.4
      - run: python -m compileall -q backend
      - run: ruff check --select E9,F63,F7,F82 backend
      - run: pytest backend/tests -q

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/static/js/app.js

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
