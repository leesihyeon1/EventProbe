name: ARTEX CI

on:
  pull_request:
    branches: [harden/artex-port-2026-11-08]
  push:
    branches: [harden/artex-port-2026-11-08]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.4
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Check Python code
        run: ruff check --select E9,F63,F7,F82 backend
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend tests and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find frontend/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run frontend tests
        run: node --test frontend/tests/*.test.js

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
